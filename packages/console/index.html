<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>墨斗 Modou 控制台</title>
  <style>
    /* ============ 令牌（DESIGN.md §1） ============ */
    :root {
      color-scheme: dark;
      --bg0: #101113; --bg1: #16171a; --bg2: #1b1d21; --bg3: #23252b;
      --sun: #0b0c0f;
      --t1: #e8e6df; --t2: #a3a198; --t3: #6d6b64;
      --line: #282a30; --line2: #3a3d45;
      --acc: #e0532f; --acc-h: #f0653f; --acc-bg: rgba(224,83,47,.13);
      --err: #cf5b66; --err-bg: rgba(207,91,102,.10);
      --dadd: #7fa477; --ddel: #b96c6c;
      --code: #d3d1ca;
      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
      --r0: 0; --r1: 2px;
      --t-fast: .15s; --t-med: .25s; --t-slow: .45s;
      --ease: cubic-bezier(.2, .8, .2, 1);
      --mono: "Cascadia Code", "JetBrains Mono", "Sarasa Mono SC", ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
      --sans: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg0: #f2f0e9; --bg1: #faf9f3; --bg2: #fffffd; --bg3: #eceade;
        --sun: #1b1c20;
        --t1: #27251e; --t2: #6a685d; --t3: #999789;
        --line: #dbd7c9; --line2: #c2beae;
        --acc: #b93d1c; --acc-h: #9d3113; --acc-bg: rgba(185,61,28,.10);
        --err: #a63a45; --err-bg: rgba(166,58,69,.08);
        --dadd: #3d7a45; --ddel: #a44f4f;
      }
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg0: #f2f0e9; --bg1: #faf9f3; --bg2: #fffffd; --bg3: #eceade;
      --sun: #1b1c20;
      --t1: #27251e; --t2: #6a685d; --t3: #999789;
      --line: #dbd7c9; --line2: #c2beae;
      --acc: #b93d1c; --acc-h: #9d3113; --acc-bg: rgba(185,61,28,.10);
      --err: #a63a45; --err-bg: rgba(166,58,69,.08);
      --dadd: #3d7a45; --ddel: #a44f4f;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg0: #101113; --bg1: #16171a; --bg2: #1b1d21; --bg3: #23252b;
      --sun: #0b0c0f;
      --t1: #e8e6df; --t2: #a3a198; --t3: #6d6b64;
      --line: #282a30; --line2: #3a3d45;
      --acc: #e0532f; --acc-h: #f0653f; --acc-bg: rgba(224,83,47,.13);
      --err: #cf5b66; --err-bg: rgba(207,91,102,.10);
      --dadd: #7fa477; --ddel: #b96c6c;
      --code: #d3d1ca;
    }

    /* ============ 基础（§1.3/1.4/1.5） ============ */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--sans); font-size: 15px; line-height: 1.7; letter-spacing: .02em;
      background: var(--bg0); color: var(--t1);
      display: flex; flex-direction: column;
    }
    .mono { font-family: var(--mono); }
    button, textarea, select, input { font: inherit; color: inherit; }
    button { border: none; background: none; cursor: pointer; padding: 0; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .45; cursor: default; }
    :focus { outline: none; }
    :focus-visible { box-shadow: 0 0 0 3px var(--acc-bg); border-color: var(--acc); }
    ::selection { background: var(--acc-bg); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ============ 组件（§2） ============ */
    /* —— 顶栏 §2.1 —— */
    header {
      display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4);
      height: 52px; flex: none; background: var(--bg1); border-bottom: 1px solid var(--line);
      position: relative; z-index: 20;
    }
    .seal { width: 20px; height: 20px; border-radius: 2px; background: var(--acc); color: var(--bg0);
            font-family: var(--mono); font-size: 13px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; flex: none; }
    .wordmark { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; color: var(--t1); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    header .spacer { flex: 1; }
    .btn { border-radius: var(--r1); padding: 6px 14px; font-size: 14px;
           border: 1px solid var(--line2); color: var(--t2); background: transparent;
           transition: border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
                       background var(--t-fast) var(--ease); }
    .btn:hover { border-color: var(--acc); color: var(--t1); }
    .btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
    .btn.primary:hover { background: var(--acc-h); border-color: var(--acc-h); }
    .btn.acc { border-color: var(--acc); color: var(--acc); background: transparent; }
    .btn.acc:hover { background: var(--acc); color: #fff; }
    .btn.ghost { border-color: var(--line2); background: transparent; color: var(--t2); }
    .btn.ghost:hover { border-color: var(--err); color: var(--err); }
    .btn.icon { padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px;
                font-family: var(--mono); font-size: 13px; max-width: 300px; }
    .btn.icon .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn.icon .caret { font-size: 10px; color: var(--t3); flex: none; }
    .btn.icon svg { width: 12px; height: 12px; flex: none; }

    /* —— 通知条 §2.1 —— */
    .notice {
      display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
      padding: 6px var(--s4); background: var(--acc-bg); color: var(--t1); font-size: 13px;
      border-bottom: 1px solid var(--line); flex: none;
    }
    .notice button { color: var(--t2); font-size: 12px; }

    /* —— 会话面板 §2.2/§3 —— */
    .session-anchor { position: relative; }
    .panel {
      position: absolute; top: calc(100% + 8px); right: 0; width: 420px; max-width: 86vw;
      background: var(--bg2); border: 1px solid var(--line2); border-radius: var(--r0);
      box-shadow: 0 8px 28px rgba(0,0,0,.28); z-index: 30; overflow: hidden;
    }
    .panel .filter { display: block; width: 100%; border: none; border-bottom: 1px solid var(--line);
                     background: var(--bg1); padding: 8px var(--s3); font-family: var(--mono); font-size: 13px; }
    .panel .filter:focus { box-shadow: none; border-bottom-color: var(--acc); }
    .panel .list { max-height: 380px; overflow-y: auto; }
    .panel .group-label { font-family: var(--mono); font-size: 12px; color: var(--t3);
                          padding: 8px var(--s3) 2px; }
    .panel .group-head { display: flex; align-items: center; justify-content: space-between;
                         padding: 8px var(--s3) 2px; }
    .panel .group-head .group-label { padding: 0; }
    .panel .group-head .select-all { display: flex; align-items: center; gap: 4px;
                                     font-family: var(--mono); font-size: 12px; color: var(--t2);
                                     cursor: pointer; }
    .panel .group-head .select-all input { accent-color: var(--acc); margin: 0; }
    .panel .bulk-bar { display: flex; align-items: center; gap: var(--s2); padding: 6px var(--s3);
                       border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px;
                       color: var(--t2); }
    .panel .bulk-bar .danger { background: var(--err); color: #fff; border-radius: var(--r1);
                               padding: 3px 10px; font-size: 12px; }
    .panel .bulk-bar .ghost { color: var(--t3); font-size: 12px; }
    .panel .bulk-bar .bulk-err { color: var(--err); font-size: 12px; }
    .panel .row .line1, .panel .row .line2 { padding-right: 22px; }
    .panel .row { display: block; width: 100%; text-align: left; padding: 7px var(--s3); position: relative;
                  border-left: 2px solid transparent; transition: background var(--t-fast) var(--ease); cursor: pointer; }
    .panel .row .row-close { position: absolute; right: 8px; bottom: 7px; font-family: var(--mono);
                             font-size: 11px; color: var(--t3); border: none; background: none;
                             padding: 2px 4px; border-radius: var(--r1); opacity: 0;
                             transition: opacity var(--t-fast) var(--ease); }
    .panel .row:hover .row-close { opacity: 1; }
    .panel .row .row-close:hover { color: var(--err); background: var(--err-bg); }
    .panel .row:hover, .panel .row.kbd-active { background: var(--bg3); }
    .panel .row.current { border-left-color: var(--acc); background: var(--bg2); }
    .panel .row .line1 { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--t1); }
    .panel .row .line1 .preview { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .panel .row .line1 .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--acc);
                              animation: pulse 2s ease-in-out infinite; flex: none; }
    .panel .row .line2 { font-family: var(--mono); font-size: 12px; color: var(--t3); padding-right: 20px; }
    .panel .empty { padding: var(--s4); text-align: center; color: var(--t3); font-size: 13px; }
    .panel .kbd-bar { border-top: 1px solid var(--line); padding: 6px var(--s3);
                      font-family: var(--mono); font-size: 11px; color: var(--t3); }

    /* —— 主列/空状态 §2.3 —— */
    main { flex: 1; overflow-y: auto; }
    .col { max-width: 860px; margin: 0 auto; padding: var(--s4); display: flex; flex-direction: column; gap: 10px; }
    .empty-state { display: flex; flex-direction: column; align-items: center; gap: var(--s3);
                   padding: var(--s6) var(--s4); margin-top: 12vh; text-align: center; }
    .empty-state .snapline { width: 220px; height: 14px; }
    @keyframes snapIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .empty-state .snapline .solid-line { transform-origin: left center; animation: snapIn .45s var(--ease) .6s both; }
    .empty-state h2 { font-size: 20px; font-weight: 600; margin: 0; }
    .empty-state p { margin: 0; color: var(--t2); }
    .empty-state .new-row { display: flex; gap: var(--s2); align-items: stretch; }
    .empty-state input { width: 260px; border: 1px solid var(--line2); border-radius: var(--r1);
                         background: var(--bg1); padding: 6px 10px; font-size: 14px; }
    .empty-state .hint { font-family: var(--mono); font-size: 12px; color: var(--t3); }
    .empty-session { display: flex; flex-direction: column; align-items: center; gap: var(--s3);
                     padding: 14vh var(--s4) 0; text-align: center; }
    .empty-session p { margin: 0; color: var(--t2); }
    .empty-session .hint { font-family: var(--mono); font-size: 12px; color: var(--t3); }
    .replay-badge { text-align: center; font-family: var(--mono); font-size: 12px; color: var(--t3); padding: 2px 0; }

    /* —— 消息 §2.4 —— */
    .msg.user { align-self: flex-end; max-width: 78%; background: var(--bg3); border: 1px solid var(--line);
                border-radius: var(--r1); padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
    .msg.assistant { align-self: stretch; border-left: 2px solid var(--line2); padding: 2px 0 2px 14px;
                     white-space: pre-wrap; word-break: break-word; }
    .msg.error { background: var(--err-bg); border-left: 2px solid var(--err); padding: 8px 12px;
                 white-space: pre-wrap; word-break: break-word; color: var(--t1); }
    .msg.error::before { content: "✕ "; font-family: var(--mono); font-size: 12px; color: var(--err); }
    .msg .who { display: block; font-family: var(--mono); font-size: 11px; color: var(--t3);
                letter-spacing: .08em; margin-bottom: 2px; }
    .msg.user .who { text-align: right; }
    .msg.assistant.streaming::after { content: "▍"; color: var(--acc); animation: cursor 1.1s steps(2) infinite; }
    @keyframes cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* —— 工具卡 §2.5 —— */
    .tool { border: 1px solid var(--line); border-radius: var(--r0); background: var(--bg2); }
    .tool-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer;
                 font-family: var(--mono); font-size: 13px; color: var(--t1); }
    .tool-head .st { color: var(--t2); flex: none; }
    .tool-head .st.pending { color: var(--acc); animation: pulse 2s ease-in-out infinite; }
    .tool-head .chip { font-size: 11px; border: 1px solid var(--line2); border-radius: var(--r1);
                       padding: 0 6px; color: var(--t2); flex: none; }
    .tool-head .text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tool-head .arrow { color: var(--t3); transition: transform var(--t-med) var(--ease); flex: none; }
    .tool.open .tool-head .arrow { transform: rotate(90deg); }
    .tool-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-med) var(--ease); }
    .tool.open .tool-body { grid-template-rows: 1fr; }
    .tool-body > pre { overflow: hidden; margin: 0; background: var(--sun); color: var(--code);
                       border-left: 2px solid var(--line); font-family: var(--mono); font-size: 13px;
                       padding: 0 10px; white-space: pre-wrap; word-break: break-word; min-height: 0; }
    .tool.open .tool-body > pre { padding-top: 8px; padding-bottom: 8px; }

    /* —— 审批卡 §2.6 —— */
    .approval { border: 1px solid var(--line2); border-top: none; background: var(--bg2); position: relative; }
    .approval .snap { height: 2px; background: repeating-linear-gradient(90deg, var(--acc) 0 6px, transparent 6px 10px);
                      position: relative; overflow: hidden; }
    .approval .snap-solid { position: absolute; inset: 0; background: var(--acc);
                             transform: scaleX(0); transform-origin: left center; }
    .approval.answered .snap-solid { transform: scaleX(1); }
    .approval.denied .snap-solid { background: var(--line2); }
    .approval.answered { opacity: .68; }
    .approval .head { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; }
    .approval .stamp { background: var(--acc); color: #fff; font-family: var(--mono); font-size: 11px;
                       padding: 1px 6px; border-radius: var(--r1); flex: none; }
    .approval .stamp.done { background: var(--line2); }
    .approval .stamp.done { background: var(--line2); }
    .approval .name { font-family: var(--mono); font-size: 13px; }
    .approval .reason { padding: 0 12px; color: var(--t2); }
    .approval .diff .add { color: var(--dadd); }
    .approval .diff .del { color: var(--ddel); }
    .approval .diff .meta { color: var(--t3); }
    .approval .diff { margin: 8px 12px; padding: 8px 10px; background: var(--sun); color: var(--code);
                      border-left: 2px solid var(--line); font-family: var(--mono); font-size: 13px;
                      overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    .approval .buttons { display: flex; gap: 8px; padding: 0 12px 10px; }
    .approval.answered .buttons { display: none; }
    .approval .status-line { padding: 0 12px 10px; font-family: var(--mono); font-size: 13px; }
    .approval .status-line.ok { color: var(--t1); }
    .approval .status-line.no { color: var(--t2); }

    /* —— 输入条 §2.7 —— */
    footer { flex: none; max-width: 860px; width: 100%; margin: 0 auto; padding: var(--s3) var(--s4) var(--s4); }
    .dock { border: 1px solid var(--line2); border-radius: var(--r1); background: var(--bg1);
            padding: 8px 10px 6px; transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
    .dock:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-bg); }
    .dock textarea { display: block; width: 100%; border: none; background: transparent; resize: vertical;
                     min-height: 48px; font-size: 15px; line-height: 1.7; }
    .dock textarea:focus { box-shadow: none; }
    .dock textarea:disabled { opacity: .5; }
    .dock .bar { display: flex; align-items: center; gap: var(--s2); margin-top: 4px; }
    .dock .bar .kbd-hint { font-family: var(--mono); font-size: 11px; color: var(--t3); flex: 1; }
    .usage { display: flex; justify-content: flex-end; gap: 6px; font-family: var(--mono); font-size: 12px;
             color: var(--t1); font-variant-numeric: tabular-nums; border-top: 1px solid var(--line);
             margin-top: var(--s2); padding-top: 6px; }
    .usage .up, .usage .down { color: var(--t3); }
    .usage .cost { color: var(--t2); }

    /* —— 令牌门 §2.9 —— */
    .token-gate { max-width: 420px; margin: 18vh auto 0; border: 1px solid var(--line2);
                  background: var(--bg2); padding: var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
    .token-gate h2 { margin: 0; font-family: var(--mono); font-size: 15px; letter-spacing: .08em; }
    .token-gate p { margin: 0; color: var(--t2); font-size: 14px; }
    .token-gate input { border: 1px solid var(--line2); border-radius: var(--r1); background: var(--bg1);
                        padding: 8px 10px; font-family: var(--mono); font-size: 14px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/assets/index.js"></script>
</body>
</html>
