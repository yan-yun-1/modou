<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>墨斗 Modou 控制台</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: #f6f7f9; color: #1c1e21; }
    @media (prefers-color-scheme: dark) {
      body { background: #16181d; color: #d6d8db; }
      .card { background: #1f2228 !important; border-color: #2c3038 !important; }
      .msg.user { background: #2b3a55 !important; }
      .tool, .approval { background: #1f2228 !important; }
      textarea, select, input { background: #1f2228 !important; color: #d6d8db !important; border-color: #3a3f47 !important; }
    }
    header { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
             background: #ffffff10; border-bottom: 1px solid #0002; position: sticky; top: 0; backdrop-filter: blur(4px); }
    header h1 { font-size: 16px; margin: 0; }
    header .spacer { flex: 1; }
    select { max-width: 320px; padding: 4px 6px; }
    button { border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer;
             background: #2563eb; color: #fff; font-size: 14px; }
    button.secondary { background: #6b7280; }
    button.danger { background: #b91c1c; }
    button:disabled { opacity: 0.45; cursor: default; }
    main { max-width: 860px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { border-radius: 8px; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
    .msg.user { background: #e0e9ff; align-self: flex-end; max-width: 85%; }
    .msg.assistant { background: #ffffff; border: 1px solid #0001; }
    .msg.error { color: #b91c1c; background: #fee2e2; }
    .streaming::after { content: "▌"; opacity: 0.5; }
    .card { background: #fff; border: 1px solid #0002; border-radius: 8px; padding: 8px 12px; }
    .tool-head { cursor: pointer; font-size: 13px; opacity: 0.85; display: flex; gap: 6px; align-items: center; }
    .tool-detail { margin: 6px 0 0; padding: 6px 8px; background: #0b102055; border-radius: 6px;
                   overflow-x: auto; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }
    .approval { border: 1px solid #f59e0b; background: #fffbeb; }
    .approval .diff { margin: 6px 0; padding: 8px; background: #0b1020; color: #d6d8db; border-radius: 6px;
                      overflow-x: auto; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }
    .approval .buttons { display: flex; gap: 8px; margin-top: 6px; }
    .approval .status { font-weight: 600; }
    footer { position: sticky; bottom: 0; background: inherit; padding: 10px 0 14px; }
    .inputbar { display: flex; gap: 8px; }
    textarea { flex: 1; resize: vertical; min-height: 52px; padding: 8px 10px;
               border: 1px solid #0003; border-radius: 8px; font: inherit; }
    .usage { font-size: 12px; opacity: 0.65; margin-top: 4px; text-align: right; }
    .token-gate { max-width: 420px; margin: 80px auto; text-align: center; display: flex; flex-direction: column; gap: 10px; }
    .token-gate input { padding: 8px 10px; border: 1px solid #0003; border-radius: 8px; font: inherit; }
    .empty { opacity: 0.55; text-align: center; padding: 40px 0; }
    .replay-badge { text-align: center; font-size: 12px; opacity: 0.6; padding: 4px 0; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; }
    .tab { padding: 3px 10px; border-radius: 14px; border: 1px solid #0002; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .tab.current { background: #2563eb; color: #fff; border-color: #2563eb; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/assets/index.js"></script>
</body>
</html>
