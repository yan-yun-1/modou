<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#212121">
<title>墨斗 Modou 控制台</title>
<style>
/* ============================================================
   一、令牌层 —— 中性面阶 + 单强调色。hex/rgba 仅存在于本段与 head meta。
   暗色默认（ChatGPT 面阶），亮色经 html[data-theme="light"] 覆写。
   分区纪律：相邻一档底色差 + 1px var(--line-1)；box-shadow 仅浮层一枚。
   ============================================================ */
:root{
  /* 面 */
  --bg-app:#212121;
  --bg-side:#171717;
  --bg-raised:#2f2f2f;
  --bg-sunken:#191919;
  --bg-user:#303030;
  --bg-hover:rgba(255,255,255,.06);
  --bg-active:rgba(255,255,255,.09);
  /* 文字 */
  --text-1:#ececec;
  --text-2:#b4b4b4;
  --text-3:#8f8f8f;
  /* 线 */
  --line-1:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.14);
  /* 强调（仅焦点环/选中态/主钮/发送钮/用量 in 段） */
  --accent:#5e6ad2;
  --accent-hover:#7480e6;
  --accent-bg:rgba(94,106,210,.16);
  --on-accent:#fff;
  /* 错误（与强调色分职） */
  --error:#e5636b;
  --error-bg:rgba(229,99,107,.10);
  /* diff（GitHub 惯例：字色与浅底成对） */
  --diff-add:#7ee787;
  --diff-del:#ff7b72;
  --diff-add-bg:rgba(46,160,67,.15);
  --diff-del-bg:rgba(248,81,73,.15);
  /* 浮层阴影（唯一一枚） */
  --shadow-pop:0 8px 24px rgba(0,0,0,.32);
  /* 字体（--f-num 为数字场景别名，等宽数字由 font-variant-numeric 保证） */
  --f-zh:system-ui,"Segoe UI","PingFang SC","Microsoft YaHei UI","Noto Sans SC",sans-serif;
  --f-num:var(--f-zh);
  --f-mono:ui-monospace,"Cascadia Code",Consolas,"Sarasa Mono SC",monospace;
  /* 间距 8px 系 */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  /* 圆角 4 档：chip·kbd / 按钮·侧栏行 / 卡片·气泡·面板 / 输入台 */
  --r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;
}
html[data-theme="light"]{
  --bg-app:#ffffff;
  --bg-side:#f9f9f9;
  --bg-raised:#ffffff;
  --bg-sunken:#f6f6f6;
  --bg-user:#f4f4f4;
  --bg-hover:rgba(0,0,0,.05);
  --bg-active:rgba(0,0,0,.08);
  --text-1:#0d0d0d;
  --text-2:#5d5d5d;
  --text-3:#8f8f8f;
  --line-1:rgba(0,0,0,.08);
  --line-2:rgba(0,0,0,.14);
  --accent-hover:#4f5ac4;
  --accent-bg:rgba(94,106,210,.12);
  --diff-add:#1a7f37;
  --diff-del:#cf222e;
  --diff-add-bg:rgba(46,160,67,.12);
  --diff-del-bg:rgba(248,81,73,.10);
  --shadow-pop:0 8px 24px rgba(0,0,0,.12);
}

/* ============================================================
   二、基础层
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark light;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
body{
  background:var(--bg-app);color:var(--text-1);
  font-family:var(--f-zh);font-size:14px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input,textarea,kbd,pre{font:inherit}
::selection{background:var(--accent-bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* ============================================================
   三、组件层
   ============================================================ */

/* ---------- 骨架：双栏 flex，零横向滚动 ---------- */
.board{display:flex;height:100dvh;overflow:hidden}
.side{flex:0 0 260px;display:flex;flex-direction:column;min-height:0;background:var(--bg-side);border-right:1px solid var(--line-1)}
.board[data-side="closed"] .side{display:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-app)}
.col{width:100%;max-width:768px;margin:0 auto;padding:0 var(--s5)}
@media (max-width:640px){
  .col{padding:0 var(--s4)}
  .empty{padding:0 var(--s4)}
}

/* ---------- 会话侧栏：行容器 + 打开钮/删除钮为兄弟节点（无交互嵌套） ---------- */
.sidehead{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s3) var(--s2)}
.sidetitle{font-size:12px;font-weight:500;color:var(--text-3)}
.side>.snew{flex:none}
.snew{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 16px);margin:2px 8px 8px;
      padding:7px 0;border:1px dashed var(--line-2);border-radius:var(--r-md);
      font-size:13px;color:var(--text-2);transition:color .15s,border-color .15s}
.snew:hover{color:var(--text-1);border-color:var(--text-3)}
.snew:active{transform:translateY(1px)}
.slist{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0;padding-bottom:var(--s2)}
.sempty{padding:var(--s5) 20px;font-size:12px;color:var(--text-3);text-align:center}
.srow{position:relative;margin:2px 8px;border-radius:var(--r-md)}
.srow:hover{background:var(--bg-hover)}
.srow.active{background:var(--bg-active);box-shadow:inset 2px 0 0 var(--accent)}
.sopen{display:block;width:100%;padding:var(--s2) 36px var(--s2) var(--s3);border-radius:inherit;text-align:left}
.srow .l1{display:block;font-size:13px;line-height:1.5;font-weight:400;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.active .l1{font-weight:500}
.srow .l2{display:block;font-size:12px;font-family:var(--f-num);color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdel{position:absolute;top:50%;right:10px;transform:translateY(-50%);width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text-3);opacity:0;transition:opacity .15s,color .15s}
.srow:hover .sdel,.sopen:focus-visible + .sdel,.sdel:focus-visible{opacity:1}
.sdel:hover{color:var(--error)}

/* ---------- 图标钮（28×28） ---------- */
.iconbtn{width:28px;height:28px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-md);color:var(--text-3);transition:color .15s,background .15s}
.iconbtn:hover{background:var(--bg-hover);color:var(--text-1)}

/* ---------- 顶栏 52px ---------- */
.top{flex:0 0 52px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line-1)}
.brand{font-size:14px;font-weight:600;color:var(--text-1)}
.topstatus{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-family:var(--f-num);color:var(--text-3);font-variant-numeric:tabular-nums}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none}
.sdot.run{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.icon-sun{display:inline-flex}
.icon-moon{display:none}
html[data-theme="light"] .icon-sun{display:none}
html[data-theme="light"] .icon-moon{display:inline-flex}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- 通知条（顶栏下通栏 36px） ---------- */
.notice{flex:none;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:36px;padding:var(--s1) var(--s4);background:var(--bg-raised);border-bottom:1px solid var(--line-1);font-size:13px;color:var(--text-1)}
.ntext{min-width:0}
.notice .iconbtn{margin-left:auto}

/* ---------- 消息流：内容列 768px 居中 ---------- */
.flow{flex:1;overflow-y:auto;min-height:0}
.flow > .col{padding-top:var(--s5);padding-bottom:96px}
.msg{margin:0 0 var(--s5);min-width:0}
.msg:last-child{margin-bottom:0}
.msg .meta{font-size:12px;color:var(--text-3);margin-bottom:var(--s2)}
.msg.usr{display:flex;flex-direction:column;align-items:flex-end}
.msg.usr .meta{margin-right:4px}
.bubble{max-width:78%;background:var(--bg-user);border-radius:var(--r-xl);padding:10px 16px;font-size:14px;line-height:1.7;color:var(--text-1);white-space:pre-wrap;word-break:break-word}
.msg.agt .bd{font-size:14px;line-height:1.7;color:var(--text-1);white-space:pre-wrap;word-break:break-word}
.msg .bd code{font-family:var(--f-mono);font-size:13px;background:var(--bg-hover);border-radius:var(--r-sm);padding:1px 5px}
.cursor{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.msg.err .ebd{background:var(--error-bg);border-left:3px solid var(--error);border-radius:var(--r-md);padding:12px 16px;font-size:14px;line-height:1.7;color:var(--text-1);white-space:pre-wrap;word-break:break-word}
.etag{font-size:12px;font-weight:500;color:var(--error);margin-right:8px}
.emptyline{padding:48px 0;text-align:center;font-size:13px;color:var(--text-3)}
.badgerow{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
.rbadge{font-size:12px;color:var(--text-3)}
.rewbtn{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-sm);font-size:12px;color:var(--text-3);transition:color .15s,background .15s}
.rewbtn:hover{background:var(--bg-hover);color:var(--text-1)}

/* ---------- 空状态：同宽列垂直居中，无装饰 ---------- */
.empty{width:100%;max-width:768px;margin:0 auto;padding:0 var(--s5);min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:var(--s4);text-align:center}
.empty h2{font-size:20px;font-weight:600;color:var(--text-1)}
.empty p{font-size:14px;color:var(--text-2)}
.exlist{display:flex;flex-direction:column;gap:var(--s2);max-width:560px;width:100%;margin-top:var(--s2)}
.excard{border:1px solid var(--line-1);border-radius:var(--r-lg);background:var(--bg-raised);padding:var(--s3) var(--s4);font-size:14px;color:var(--text-1);text-align:left;transition:background .15s,border-color .15s}
.excard:hover{background:var(--bg-hover);border-color:var(--line-2)}

/* ---------- 工具卡：一档底色差 + 限高输出 ---------- */
.card{position:relative;border:1px solid var(--line-1);border-radius:var(--r-lg);background:var(--bg-raised);margin:var(--s2) 0;overflow:hidden}
.chead{display:flex;align-items:center;gap:8px;width:100%;padding:var(--s2) 44px var(--s2) var(--s3);cursor:pointer;transition:background .15s}
.chead:hover:not(:disabled){background:var(--bg-hover)}
.chead:disabled{cursor:default}
.cdot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--text-3)}
.cdot.run{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.ctool{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--text-1);white-space:nowrap}
.cdesc{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccopy{position:absolute;top:6px;right:8px;z-index:1;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text-3);opacity:0;transition:opacity .15s,color .15s,background .15s}
.card:hover .ccopy,.ccopy:focus-visible{opacity:1}
.ccopy:hover{background:var(--bg-hover);color:var(--text-1)}
.ccopy.ok{color:var(--accent);opacity:1}
.cbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.card.open .cbody{grid-template-rows:1fr}
.cinner{overflow:hidden;min-height:0}
.params{padding:var(--s1) var(--s3) var(--s2)}
.prow{display:grid;grid-template-columns:88px 1fr;gap:var(--s3);align-items:baseline;padding:6px 0}
.prow + .prow{border-top:1px solid var(--line-1)}
.prow .k{font-size:12px;color:var(--text-3)}
.prow .v{font-family:var(--f-mono);font-size:13px;color:var(--text-1);word-break:break-all}
.cout{display:flex;gap:var(--s3);background:var(--bg-sunken);border-radius:var(--r-md);margin:var(--s2) var(--s3) var(--s3);padding:var(--s3);max-height:320px;overflow:auto}
.cout pre{flex:1;min-width:0;margin:0;font-family:var(--f-mono);font-size:13px;line-height:1.6;color:var(--text-1);white-space:pre}
.lnos{flex:none;width:28px;min-width:28px;text-align:right;user-select:none;font-family:var(--f-mono);font-size:12px;line-height:calc(13px * 1.6);color:var(--text-3);font-variant-numeric:tabular-nums}
.lnos span{display:block}

/* ---------- 审批卡 ---------- */
.approve{border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--bg-raised);margin:var(--s2) 0;overflow:hidden;transition:opacity .25s}
.approve.answered{opacity:.6}
.ahead{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-1)}
.achip{flex:none;font-size:12px;font-weight:500;background:var(--accent-bg);color:var(--accent);border-radius:var(--r-sm);padding:2px 8px}
.areason{flex:1;min-width:0;font-size:14px;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.astat{flex:none;font-size:12px;font-family:var(--f-num);color:var(--text-3);font-variant-numeric:tabular-nums}
.aid{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--text-3)}
.approve .diff{margin:0 var(--s4) var(--s3)}
.diff{background:var(--bg-sunken);border-radius:var(--r-md);padding:var(--s3);max-height:320px;overflow:auto;font-family:var(--f-mono);font-size:13px;line-height:1.6;white-space:pre;color:var(--text-3)}
.diff .add{display:block;color:var(--diff-add);background:var(--diff-add-bg)}
.diff .del{display:block;color:var(--diff-del);background:var(--diff-del-bg)}
.diff .ctx{display:block}
.abtns{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4)}
.astate{font-size:13px;color:var(--text-2)}
.abtn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-md);padding:6px 16px;font-size:13px;font-weight:500;transition:background .15s,color .15s,border-color .15s}
.abtn.primary{background:var(--accent);color:var(--on-accent)}
.abtn.primary:hover:not(:disabled){background:var(--accent-hover)}
.abtn.primary:active:not(:disabled){transform:translateY(1px)}
.abtn.secondary{border:1px solid var(--line-2)}
.abtn.secondary:hover:not(:disabled){background:var(--bg-hover)}
.abtn.ghost{color:var(--text-2)}
.abtn.ghost:hover:not(:disabled){background:var(--bg-hover);color:var(--error)}
.abtn:disabled{opacity:.4;pointer-events:none}
.abtn kbd{font-size:12px;line-height:1;background:var(--bg-hover);border-radius:var(--r-sm);padding:1px 5px;border-bottom:1px solid var(--line-2)}

/* ---------- 底部：用量单行 + 输入台 ---------- */
.bottom{flex:none;padding-bottom:var(--s5)}
.bottom .col{display:flex;flex-direction:column;gap:var(--s2)}
.bottom .usage{order:2;margin-top:var(--s1)}
.usage{display:flex;justify-content:center;align-items:center;gap:var(--s3);font-size:12px;font-family:var(--f-num);color:var(--text-3);font-variant-numeric:tabular-nums}
.usage b{font-weight:500;color:var(--text-1)}
.ubar{width:160px;height:4px;border-radius:var(--r-sm);background:var(--bg-hover);overflow:hidden;display:flex}
.ubar .in{background:var(--accent)}
.ubar .out{background:var(--text-3)}
.dock{background:var(--bg-raised);border:1px solid var(--line-2);border-radius:var(--r-xl);padding:var(--s3) var(--s4);transition:border-color .15s}
.dock:focus-within{border-color:var(--accent)}
.dock textarea{display:block;width:100%;resize:none;border:0;outline:0;background:transparent;font-family:var(--f-zh);font-size:14px;line-height:1.6;color:var(--text-1);max-height:200px}
.dock textarea::placeholder{color:var(--text-3);opacity:1}
.dockfoot{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2)}
.dockhint{font-family:var(--f-mono);font-size:12px;color:var(--text-3)}
.send{margin-left:auto;flex:none;display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);transition:background .15s,color .15s}
.send:hover:not(:disabled){background:var(--accent-hover)}
.send:active:not(:disabled){transform:translateY(1px)}
.send:disabled{opacity:.4;cursor:default}
.send.cancel{background:transparent;color:var(--text-2);border-radius:16px;padding:0 12px;font-size:13px;font-weight:500}
.send.cancel:hover{background:var(--bg-hover);color:var(--text-1)}

/* ---------- 令牌门 ---------- */
.gate{height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg-app);padding:var(--s6)}
.gatecard{width:100%;max-width:420px;display:flex;flex-direction:column;gap:var(--s3)}
.gatecard h2{font-size:20px;font-weight:600;color:var(--text-1)}
.gatecard p{font-size:13px;line-height:1.7;color:var(--text-2)}
.gatecard input{height:36px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--bg-raised);padding:0 12px;font-size:14px;color:var(--text-1);outline:0;transition:border-color .15s}
.gatecard input:focus{border-color:var(--accent)}
.gatecard input::placeholder{color:var(--text-3)}
.gatecard .abtn{align-self:flex-start}

/* ---- 目录选择弹层（Phase F3）---- */
.dp-mask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;animation:dpIn .18s ease}
@keyframes dpIn{from{opacity:0}to{opacity:1}}
.dp{width:min(560px,92vw);max-height:72vh;display:flex;flex-direction:column;background:var(--bg-raised);border:1px solid var(--line-1);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);animation:dpPop .18s ease}
@keyframes dpPop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.dp-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-1)}
.dp-title{font-size:13px;font-weight:600;color:var(--text-1)}
.dp-x{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-3);border-radius:var(--r-sm)}
.dp-x:hover{background:var(--bg-hover);color:var(--text-1)}
.dp-recents{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-1)}
.dp-lab{font-size:12px;color:var(--text-3)}
.dp-chip{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 12px;border:1px solid var(--line-2);border-radius:999px;font-size:12px;font-family:var(--f-mono);color:var(--text-2);transition:color .15s,border-color .15s,background .15s}
.dp-chip:hover{color:var(--text-1);border-color:var(--text-3);background:var(--bg-hover)}
.dp-crumb{display:flex;flex-wrap:wrap;gap:2px;padding:var(--s2) var(--s4);border-bottom:1px solid var(--line-1);font-family:var(--f-mono);font-size:12px}
.dp-crumbseg{padding:2px 4px;color:var(--text-3);border-radius:4px}
.dp-crumbseg:hover{color:var(--text-1);background:var(--bg-hover)}
.dp-crumbseg.tail{color:var(--text-1)}
.dp-list{flex:1;min-height:120px;overflow-y:auto;padding:var(--s2)}
.dp-row{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;font-size:13px;color:var(--text-1);border-radius:var(--r-sm)}
.dp-row:hover{background:var(--bg-hover)}
.dp-row svg{flex:none;color:var(--text-3)}
.dp-rowname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-empty{padding:var(--s5);text-align:center;font-size:12px;color:var(--text-3)}
.dp-err{padding:var(--s2) var(--s4);font-size:12px;color:var(--error);background:var(--error-bg)}
.dp-wait{padding:var(--s2) var(--s4);font-size:12px;color:var(--text-2);background:var(--bg-hover)}
.dp-foot{display:flex;gap:var(--s2);padding:var(--s3) var(--s4);border-top:1px solid var(--line-1)}
.dp-native{flex:none;padding:7px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:13px;color:var(--text-2);white-space:nowrap}
.dp-native:hover{color:var(--text-1);border-color:var(--text-3);background:var(--bg-hover)}
.dp-native:disabled{opacity:.55;cursor:default}
.dp-input{flex:1;min-width:0;background:var(--bg-sunken);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 10px;font-size:13px;font-family:var(--f-mono);color:var(--text-1)}
.dp-input::placeholder{color:var(--text-3)}
.dp-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.dp-go{flex:none;padding:7px 14px;background:var(--accent);color:var(--on-accent);border-radius:var(--r-sm);font-size:13px;font-weight:500}
.dp-go:hover{background:var(--accent-hover)}
.dp-go:disabled{opacity:.5;cursor:not-allowed}
/* 会话工作目录 chip（Phase F4）——输入台上方左侧 */
.cwdchip{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-family:var(--f-mono);color:var(--text-3);padding:0 2px}
/* 空态目录 chip（Phase F3） */
.escwd{font-size:12px;font-family:var(--f-mono);color:var(--text-3);padding:4px 12px;border:1px dashed var(--line-2);border-radius:999px}
.escwd:hover{color:var(--text-1);border-color:var(--text-3)}
</style>
</head>
<body>
  <div id="app"></div>
  <script src="/assets/index.js"></script>
</body>
</html>
